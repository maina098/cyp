services:
  - type: web
    name: cyp-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    preDeployCommand: npm run db:migrate
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to the existing Supabase PostgreSQL connection string in Render.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      # Comma-separated browser origins allowed to call the API.
      - key: FRONTEND_URL
        value: https://coastalyouthparliament.co.ke,https://www.coastalyouthparliament.co.ke,https://backend.coastalyouthparliament.co.ke
  - type: web
    name: cyp-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://backend.coastalyouthparliament.co.ke
      - key: NEXT_PUBLIC_WS_URL
        value: https://backend.coastalyouthparliament.co.ke
